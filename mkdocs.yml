site_name: Charm++ Tutorial
site_description: A hands-on introduction to parallel programming with Charm++
site_author: Laxmikant V. Kale
site_url: https://charmplusplus.org/charm-tutorial/

docs_dir: tutorial
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Chapter 1 — Introduction: ch1_introduction.md
  - Chapter 2 — Basic Chares: ch2_basic_chares.md
  - Chapter 3 — Chare Arrays: ch3_chare_arrays.md
  - Chapter 4 — Structured Dagger: ch4_sdag.md
  - Exercise — DHT: exercise_dht.md
  - Chapter 5 — PUP: ch5_pup.md
  - Chapter 6 — Load Balancing: ch6_load_balancing.md
  - Chapter 7 — Threaded Methods: ch7_threaded.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
